<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Tamil Nadu Calendar 2026 - Official Calendar and Public Holidays">

    <title>Tamil Nadu Calendar 2026</title>


    <style>

        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            min-height: 100vh;

            font-family:
                Inter,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            color: #ffffff;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    rgba(6, 182, 212, 0.20),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 85% 25%,
                    rgba(139, 92, 246, 0.22),
                    transparent 32%
                ),

                linear-gradient(
                    135deg,
                    #020617 0%,
                    #0f172a 45%,
                    #111827 70%,
                    #020617 100%
                );

            background-attachment: fixed;

            overflow-x: hidden;
        }


        /* =========================================================
           ANIMATED BACKGROUND GRID
        ========================================================= */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: -5;

            background-image:

                linear-gradient(
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                );

            background-size: 50px 50px;

            animation:
                backgroundGrid 20s linear infinite;
        }


        @keyframes backgroundGrid {

            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(50px);
            }

        }


        /* =========================================================
           GLOW BLOBS
        ========================================================= */

        .background-glow {

            position: fixed;

            width: 420px;
            height: 420px;

            border-radius: 50%;

            filter: blur(110px);

            opacity: 0.20;

            pointer-events: none;

            z-index: -4;
        }


        .glow-one {

            top: -150px;
            left: -150px;

            background: #06b6d4;

            animation:
                blobOne 12s ease-in-out infinite;
        }


        .glow-two {

            right: -150px;
            top: 30%;

            background: #8b5cf6;

            animation:
                blobTwo 14s ease-in-out infinite;
        }


        .glow-three {

            bottom: -200px;
            left: 35%;

            background: #2563eb;

            animation:
                blobThree 16s ease-in-out infinite;
        }


        @keyframes blobOne {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(130px, 90px);
            }

        }


        @keyframes blobTwo {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-110px, 100px);
            }

        }


        @keyframes blobThree {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(90px, -100px);
            }

        }


        /* =========================================================
           PARTICLES
        ========================================================= */

        .particles {

            position: fixed;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: -3;
        }


        .particle {

            position: absolute;

            width: 4px;
            height: 4px;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.65);

            box-shadow:
                0 0 12px
                rgba(34,211,238,0.8);

            animation:
                particleFloat linear infinite;
        }


        .particle:nth-child(1) {
            left: 8%;
            animation-duration: 14s;
            animation-delay: -2s;
        }

        .particle:nth-child(2) {
            left: 18%;
            animation-duration: 18s;
            animation-delay: -5s;
        }

        .particle:nth-child(3) {
            left: 32%;
            animation-duration: 13s;
            animation-delay: -8s;
        }

        .particle:nth-child(4) {
            left: 48%;
            animation-duration: 20s;
            animation-delay: -3s;
        }

        .particle:nth-child(5) {
            left: 63%;
            animation-duration: 16s;
            animation-delay: -7s;
        }

        .particle:nth-child(6) {
            left: 78%;
            animation-duration: 19s;
            animation-delay: -10s;
        }

        .particle:nth-child(7) {
            left: 91%;
            animation-duration: 15s;
            animation-delay: -4s;
        }


        @keyframes particleFloat {

            0% {
                top: 110%;
                opacity: 0;
                transform:
                    translateX(0)
                    scale(0.5);
            }

            10% {
                opacity: 1;
            }

            50% {
                transform:
                    translateX(60px)
                    scale(1);
            }

            90% {
                opacity: 1;
            }

            100% {
                top: -10%;
                opacity: 0;
                transform:
                    translateX(-50px)
                    scale(0.5);
            }

        }


        /* =========================================================
           MAIN CONTAINER
        ========================================================= */

        .container {

            width: min(1400px, 94%);

            margin: auto;

            padding:
                25px 0 60px;
        }


        /* =========================================================
           HERO
        ========================================================= */

        .hero-header {

            position: relative;

            text-align: center;

            padding:
                40px 15px 35px;

            margin-bottom: 20px;

            overflow: hidden;
        }


        .hero-content {

            position: relative;

            z-index: 2;
        }


        .hero-title {

            font-size:
                clamp(
                    2.2rem,
                    6vw,
                    5rem
                );

            line-height: 1.05;

            font-weight: 900;

            letter-spacing: -2px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #a5f3fc,
                    #c4b5fd,
                    #60a5fa,
                    #ffffff
                );

            background-size: 300% auto;

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            animation:
                titleGradient 6s ease-in-out infinite,
                titleGlow 3s ease-in-out infinite alternate;
        }


        .hero-title span {

            display: inline-block;

            background:
                linear-gradient(
                    135deg,
                    #22d3ee,
                    #818cf8,
                    #c084fc,
                    #22d3ee
                );

            background-size: 300% 300%;

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            animation:
                yearFloat 3s ease-in-out infinite,
                yearGradient 4s ease infinite;
        }


        @keyframes titleGradient {

            0% {
                background-position: 0% center;
            }

            50% {
                background-position: 100% center;
            }

            100% {
                background-position: 0% center;
            }

        }


        @keyframes titleGlow {

            from {

                filter:
                    drop-shadow(
                        0 0 5px
                        rgba(34,211,238,0.15)
                    );
            }

            to {

                filter:
                    drop-shadow(
                        0 0 22px
                        rgba(34,211,238,0.45)
                    );
            }

        }


        @keyframes yearFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }

        }


        @keyframes yearGradient {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }

        }


        .hero-subtitle {

            margin-top: 18px;

            font-size:
                clamp(
                    0.8rem,
                    2vw,
                    1.2rem
                );

            font-weight: 600;

            letter-spacing: 4px;

            text-transform: uppercase;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.72
                );

            animation:
                subtitleGlow 3s
                ease-in-out
                infinite alternate;
        }


        @keyframes subtitleGlow {

            from {
                opacity: 0.65;

                text-shadow:
                    0 0 5px
                    rgba(255,255,255,0.1);
            }

            to {
                opacity: 1;

                text-shadow:
                    0 0 15px
                    rgba(34,211,238,0.45);
            }

        }


        /* =========================================================
           AOS
        ========================================================= */

        .aos-element {

            opacity: 0;

            will-change:
                transform,
                opacity;

            transition:
                opacity 0.75s ease,
                transform 0.75s
                cubic-bezier(
                    0.22,
                    1,
                    0.36,
                    1
                );
        }


        .aos-fade-up {
            transform:
                translateY(70px);
        }


        .aos-fade-down {
            transform:
                translateY(-70px);
        }


        .aos-fade-left {
            transform:
                translateX(-80px);
        }


        .aos-fade-right {
            transform:
                translateX(80px);
        }


        .aos-zoom {
            transform:
                scale(0.78);
        }


        .aos-visible {

            opacity: 1;

            transform:
                translate3d(
                    0,
                    0,
                    0
                )
                scale(1);
        }


        /* =========================================================
           SUMMARY
        ========================================================= */

        .summary-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin:
                20px 0 30px;
        }


        .summary-card {

            position: relative;

            padding:
                28px 20px;

            text-align: center;

            border:
                1px solid
                rgba(255,255,255,0.12);

            border-radius: 22px;

            background:
                rgba(255,255,255,0.06);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.20);

            overflow: hidden;

            transition:
                transform 0.35s ease,
                box-shadow 0.35s ease,
                border-color 0.35s ease;
        }


        .summary-card:hover {

            transform:
                translateY(-8px);

            border-color:
                rgba(34,211,238,0.35);

            box-shadow:
                0 25px 60px
                rgba(34,211,238,0.12);
        }


        .summary-number {

            display: block;

            font-size:
                clamp(
                    2.1rem,
                    4vw,
                    3rem
                );

            font-weight: 900;

            color:
                #67e8f9;

            margin-bottom: 7px;
        }


        .summary-label {

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.68
                );

            font-size: 0.9rem;

            text-transform: uppercase;

            letter-spacing: 1.5px;
        }


        /* =========================================================
           CONTROLS
        ========================================================= */

        .controls {

            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 12px;

            margin:
                20px 0 35px;
        }


        .filter-button {

            position: relative;

            padding:
                13px 22px;

            border:
                1px solid
                rgba(255,255,255,0.12);

            border-radius: 999px;

            background:
                rgba(255,255,255,0.07);

            color: #ffffff;

            font-size: 0.95rem;

            font-weight: 700;

            cursor: pointer;

            overflow: hidden;

            transition:
                transform 0.3s ease,
                background 0.3s ease,
                box-shadow 0.3s ease,
                border-color 0.3s ease;
        }


        .filter-button:hover {

            transform:
                translateY(-3px);

            border-color:
                rgba(34,211,238,0.4);

            box-shadow:
                0 10px 30px
                rgba(34,211,238,0.15);
        }


        .filter-button.active {

            background:
                linear-gradient(
                    135deg,
                    #0891b2,
                    #6366f1
                );

            border-color:
                transparent;

            box-shadow:
                0 10px 30px
                rgba(99,102,241,0.28);
        }


        /* =========================================================
           CALENDAR GRID
        ========================================================= */

        .calendar-container {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(250px, 1fr)
                );

            gap: 18px;

            min-height: 200px;
        }


        /* =========================================================
           DATE CARD
        ========================================================= */

        .date-card {

            position: relative;

            min-height: 205px;

            padding: 22px;

            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.09),
                    rgba(255,255,255,0.035)
                );

            border:
                1px solid
                rgba(255,255,255,0.10);

            backdrop-filter:
                blur(15px);

            -webkit-backdrop-filter:
                blur(15px);

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.16);

            overflow: hidden;

            transition:
                transform 0.4s ease,
                border-color 0.4s ease,
                box-shadow 0.4s ease;
        }


        .date-card:hover {

            transform:
                translateY(-8px)
                scale(1.015);

            border-color:
                rgba(34,211,238,0.32);

            box-shadow:
                0 25px 60px
                rgba(0,0,0,0.28);
        }


        /* =========================================================
           SUNDAY
        ========================================================= */

        .date-card.sunday {

            border-left:
                4px solid #ef4444;
        }


        .sunday-label {

            display: inline-block;

            margin-top: 14px;

            padding:
                5px 10px;

            border-radius: 999px;

            background:
                rgba(
                    239,
                    68,
                    68,
                    0.13
                );

            color:
                #fca5a5;

            font-size:
                0.75rem;

            font-weight: 700;
        }


        /* =========================================================
           HOLIDAY
        ========================================================= */

        .date-card.holiday {

            border-top:
                4px solid #f59e0b;

            background:
                linear-gradient(
                    145deg,
                    rgba(245,158,11,0.12),
                    rgba(255,255,255,0.035)
                );
        }


        .holiday-info {

            margin-top: 15px;

            padding:
                11px 12px;

            border-radius: 11px;

            background:
                rgba(
                    245,
                    158,
                    11,
                    0.12
                );

            border:
                1px solid
                rgba(
                    245,
                    158,
                    11,
                    0.25
                );

            color:
                #fcd34d;

            font-size:
                0.83rem;

            line-height: 1.5;
        }


        .holiday-type {

            margin-top: 4px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.55
                );

            font-size:
                0.72rem;

            text-transform:
                uppercase;

            letter-spacing:
                0.8px;
        }


        /* =========================================================
           DATE CONTENT
        ========================================================= */

        .date-number {

            font-size:
                2rem;

            font-weight:
                900;

            color:
                #67e8f9;
        }


        .date-month {

            margin-top: 2px;

            font-size:
                0.8rem;

            text-transform:
                uppercase;

            letter-spacing:
                2px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.55
                );
        }


        .date-day {

            margin-top: 15px;

            font-size:
                1.05rem;

            font-weight:
                700;
        }


        .full-date {

            margin-top: 5px;

            font-size:
                0.85rem;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.55
                );
        }


        /* =========================================================
           LOADING
        ========================================================= */

        .loading {

            grid-column:
                1 / -1;

            display: flex;

            flex-direction:
                column;

            align-items:
                center;

            justify-content:
                center;

            gap: 15px;

            min-height:
                250px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.65
                );
        }


        .spinner {

            width: 50px;
            height: 50px;

            border:
                4px solid
                rgba(255,255,255,0.12);

            border-top-color:
                #22d3ee;

            border-right-color:
                #818cf8;

            border-radius: 50%;

            animation:
                spin 0.9s
                linear
                infinite;
        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }

        }


        /* =========================================================
           ERROR
        ========================================================= */

        .error-message {

            grid-column:
                1 / -1;

            padding:
                30px;

            text-align:
                center;

            border-radius:
                18px;

            background:
                rgba(
                    239,
                    68,
                    68,
                    0.10
                );

            border:
                1px solid
                rgba(
                    239,
                    68,
                    68,
                    0.25
                );

            color:
                #fca5a5;
        }


        /* =========================================================
           FOOTER
        ========================================================= */

        footer {

            text-align:
                center;

            margin-top:
                55px;

            padding:
                25px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.45
                );

            font-size:
                0.85rem;
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 900px) {

            .summary-grid {

                grid-template-columns:
                    1fr;
            }

            .calendar-container {

                grid-template-columns:
                    repeat(
                        auto-fit,
                        minmax(220px, 1fr)
                    );
            }

        }


        @media (max-width: 600px) {

            .container {

                width: 92%;
            }


            .hero-header {

                padding:
                    30px 10px 25px;
            }


            .hero-title {

                letter-spacing:
                    -1px;
            }


            .hero-subtitle {

                letter-spacing:
                    2px;
            }


            .controls {

                gap: 8px;
            }


            .filter-button {

                padding:
                    10px 15px;

                font-size:
                    0.82rem;
            }


            .calendar-container {

                grid-template-columns:
                    1fr;
            }


            .aos-fade-left,
            .aos-fade-right {

                transform:
                    translateY(50px);
            }

        }


        /* =========================================================
           REDUCED MOTION
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            html {
                scroll-behavior:
                    auto;
            }


            *,
            *::before,
            *::after {

                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    0.01ms !important;
            }


            .aos-element {

                opacity: 1 !important;

                transform:
                    none !important;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================================
         BACKGROUND
    ========================================================= -->

    <div class="background-glow glow-one"></div>

    <div class="background-glow glow-two"></div>

    <div class="background-glow glow-three"></div>


    <div class="particles">

        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>

    </div>



    <!-- =========================================================
         MAIN
    ========================================================= -->

    <main class="container">


        <!-- =====================================================
             HEADER
        ===================================================== -->

        <header class="hero-header">

    <div class="hero-content">

        <h1 class="hero-title aos-element aos-fade-down">
            Tamil Nadu Calendar <span>2026</span>
        </h1>

        <p
            class="hero-subtitle aos-element aos-fade-up"
            data-aos-delay="180"
        >
            Official Calendar • 2026
        </p>

    </div>

</header>



        <!-- =====================================================
             SUMMARY
        ===================================================== -->

        <section class="summary-grid">


            <article
                class="
                    summary-card
                    aos-element
                    aos-fade-up
                "
                data-aos-delay="0"
            >

                <span
                    id="totalDays"
                    class="summary-number"
                >
                    0
                </span>

                <span class="summary-label">
                    Total Days
                </span>

            </article>



            <article
                class="
                    summary-card
                    aos-element
                    aos-fade-up
                "
                data-aos-delay="120"
            >

                <span
                    id="holidayCount"
                    class="summary-number"
                >
                    0
                </span>

                <span class="summary-label">
                    Holidays
                </span>

            </article>



            <article
                class="
                    summary-card
                    aos-element
                    aos-fade-up
                "
                data-aos-delay="240"
            >

                <span
                    id="sundayCount"
                    class="summary-number"
                >
                    0
                </span>

                <span class="summary-label">
                    Sundays
                </span>

            </article>


        </section>



        <!-- =====================================================
             FILTER BUTTONS
        ===================================================== -->

        <section class="controls">


            <button
                id="allButton"
                class="
                    filter-button
                    active
                    aos-element
                    aos-fade-up
                "
                data-aos-delay="0"
                type="button"
            >

                Show All Dates

            </button>



            <button
                id="sundayButton"
                class="
                    filter-button
                    aos-element
                    aos-fade-up
                "
                data-aos-delay="100"
                type="button"
            >

                Show Sundays

            </button>



            <button
                id="holidayButton"
                class="
                    filter-button
                    aos-element
                    aos-fade-up
                "
                data-aos-delay="200"
                type="button"
            >

                Show Holidays

            </button>


        </section>



        <!-- =====================================================
             CALENDAR
        ===================================================== -->

        <section
            id="calendarContainer"
            class="calendar-container"
            aria-live="polite"
        >

            <div class="loading">

                <div class="spinner"></div>

                <p>
                    Loading Tamil Nadu Calendar 2026...
                </p>

            </div>

        </section>



        <!-- =====================================================
             FOOTER
        ===================================================== -->

        <footer
            class="
                aos-element
                aos-fade-up
            "
        >

            Tamil Nadu Calendar • 2026

        </footer>


    </main>



    <!-- =========================================================
         JAVASCRIPT
    ========================================================= -->

    <script>

        "use strict";


        /* ========================================================
           GLOBAL DATA
        ======================================================== */

        let calendarData = [];


        /* ========================================================
           OFFICIAL TAMIL NADU 2026 HOLIDAYS

           These dates are used as a reliable fallback so the
           Holiday counter does NOT depend on a JSON property
           such as "isHoliday".
        ======================================================== */

        const officialHolidays2026 = {

            "2026-01-01": {
                name: "New Year's Day",
                type: "Public Holiday"
            },

            "2026-01-15": {
                name: "Pongal",
                type: "Public Holiday"
            },

            "2026-01-16": {
                name: "Thiruvalluvar Day",
                type: "Public Holiday"
            },

            "2026-01-17": {
                name: "Uzhavar Thirunal",
                type: "Public Holiday"
            },

            "2026-01-26": {
                name: "Republic Day",
                type: "National Holiday"
            },

            "2026-02-01": {
                name: "Thai Poosam",
                type: "Public Holiday"
            },

        /* ========================================================

        ======================================================== */

            "DOMContentLoaded",
            function () {

                initializeAOS();

                loadCalendar();

        /* ========================================================
           LOAD JSON
        ======================================================== */

        async function loadCalendar() {

            const container =
                document.getElementById(
                    "calendarContainer"
                );


            try {

                const response =
                    await fetch(
                        "tamil_nadu_calendar_2026.json",
                        {
                            cache: "no-cache"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "HTTP error: " +
                        response.status
                    );

                }


                const data =
                    await response.json();


                if (
                    !data ||
                    !Array.isArray(data.dates)
                ) {

                    throw new Error(
                        "The JSON file does not contain a valid dates array."
                    );

                }


                calendarData =
                    data.dates;


                /*
                 * Normalize every date.
                 *
                 * This is the important fix.
                 */

                calendarData =
                    calendarData.map(
                        normalizeDate
                    );


                updateSummary();


                displayDates(
                    calendarData
                );

            }


            catch (error) {

                console.error(
                    "Calendar loading error:",
                    error
                );


                container.innerHTML = `

                    <div class="error-message">

                        <strong>
                            Unable to load calendar data.
                        </strong>

                        <br><br>

                        Make sure:

                        <br>

                        <strong>
                            tamil_nadu_calendar_2026.json
                        </strong>

                        <br>

                        is in the same folder as this HTML file.

                        <br><br>

                        ${escapeHTML(
                            error.message
                        )}

                    </div>

                `;

            }

        }


        /* ========================================================
           NORMALIZE DATE
        ======================================================== */

        function normalizeDate(date) {

            const normalized =
                {
                    ...date
                };


            /*
             * Find the actual ISO date.
             */

            const isoDate =
                getISODate(date);


            normalized.isoDate =
                isoDate;


            /*
             * Match against official holiday list.
             */

            const officialHoliday =
                officialHolidays2026[
                    isoDate
                ];


            if (officialHoliday) {

                normalized.isHoliday =
                    true;

                normalized.holidayName =
                    officialHoliday.name;

                normalized.holidayType =
                    officialHoliday.type;

            }
            else {

                /*
                 * Preserve an existing holiday
                 * if the JSON already contains one.
                 */

                normalized.isHoliday =
                    isTruthyHoliday(
                        date
                    );

            }


            return normalized;

        }


        /* ========================================================
           GET ISO DATE
        ======================================================== */

        function getISODate(date) {

            /*
             * 1. Try date.date
             *
             * Screenshot shows values such as:
             * 2026-01-04
             */

            const possibleDate =
                date.date ||
                date.fullDate ||
                date.full_date ||
                date.isoDate ||
                date.formattedDate;


            if (possibleDate) {

                const match =
                    String(possibleDate)
                        .match(
                            /\b(2026-\d{2}-\d{2})\b/
                        );


                if (match) {

                    return match[1];

                }

            }


            /*
             * 2. Try explicit year/month/day
             */

            const year =
                date.year || 2026;


            const month =
                date.monthNumber ||
                date.monthIndex;


            const day =
                date.dayNumber;


            if (
                month !== undefined &&
                day !== undefined
            ) {

                let monthNumber =
                    Number(month);


                /*
                 * If monthIndex is 0-11,
                 * convert it to 1-12.
                 */

                if (
                    date.monthIndex !== undefined &&
                    !date.monthNumber
                ) {

                    monthNumber += 1;

                }


                return (
                    String(year) +
                    "-" +
                    String(monthNumber)
                        .padStart(2, "0") +
                    "-" +
                    String(day)
                        .padStart(2, "0")
                );

            }


            return "";

        }


        /* ========================================================
           HOLIDAY DETECTION
        ======================================================== */

        function isHoliday(date) {

            /*
             * First use normalized official data.
             */

            if (
                date.isoDate &&
                officialHolidays2026[
                    date.isoDate
                ]
            ) {

                return true;

            }


            /*
             * Fallback to JSON fields.
             */

            return isTruthyHoliday(
                date
            );

        }


        function isTruthyHoliday(date) {

            if (
                date.isHoliday === true ||
                date.isHoliday === 1 ||
                date.isHoliday === "true"
            ) {

                return true;

            }


            if (
                date.holiday === true ||
                date.holiday === 1 ||
                date.holiday === "true"
            ) {

                return true;

            }


            /*
             * If holidayName exists,
             * treat it as a holiday.
             */

            if (
                typeof date.holidayName ===
                    "string" &&
                date.holidayName.trim() !== ""
            ) {

                return true;

            }


            return false;

        }


        /* ========================================================
           UPDATE SUMMARY
        ======================================================== */

        function updateSummary() {

            const totalDays =
                calendarData.length;


            const holidayCount =
                calendarData.filter(
                    function (date) {

                        return isHoliday(
                            date
                        );

                    }
                ).length;


            const sundayCount =
                calendarData.filter(
                    function (date) {

                        return isSunday(
                            date
                        );

                    }
                ).length;


            animateNumber(
                "totalDays",
                totalDays
            );


            animateNumber(
                "holidayCount",
                holidayCount
            );


            animateNumber(
                "sundayCount",
                sundayCount
            );

        }


        /* ========================================================
           SUNDAY DETECTION
        ======================================================== */

        function isSunday(date) {

            /*
             * JSON says Sunday.
             */

            if (
                typeof date.day === "string" &&
                date.day
                    .trim()
                    .toLowerCase() ===
                    "sunday"
            ) {

                return true;

            }


            /*
             * Use ISO date.
             */

            if (date.isoDate) {

                const parsed =
                    new Date(
                        date.isoDate +
                        "T00:00:00"
                    );


                if (
                    !Number.isNaN(
                        parsed.getTime()
                    )
                ) {

                    return (
                        parsed.getDay() === 0
                    );

                }

            }


            return false;

        }


        /* ========================================================
           NUMBER ANIMATION
        ======================================================== */

        function animateNumber(
            id,
            target
        ) {

            const element =
                document.getElementById(
                    id
                );


            if (!element) {
                return;
            }


            const duration = 900;

            const start =
                performance.now();


            function update(
                currentTime
            ) {

                const progress =
                    Math.min(
                        (
                            currentTime -
                            start
                        ) / duration,
                        1
                    );


                const eased =
                    1 -
                    Math.pow(
                        1 - progress,
                        3
                    );


                element.textContent =
                    Math.floor(
                        target * eased
                    );


                if (
                    progress < 1
                ) {

                    requestAnimationFrame(
                        update
                    );

                }
                else {

                    element.textContent =
                        target;

                }

            }


            requestAnimationFrame(
                update
            );

        }


        /* ========================================================
           DISPLAY DATES
        ======================================================== */

        function displayDates(
            dates
        ) {

            const container =
                document.getElementById(
                    "calendarContainer"
                );


            container.innerHTML = "";


            if (
                !Array.isArray(dates) ||
                dates.length === 0
            ) {

                container.innerHTML = `

                    <div class="error-message">

                        No calendar dates found.

                    </div>

                `;

                return;

            }


            dates.forEach(
                function (
                    date,
                    index
                ) {

                    const card =
                        document.createElement(
                            "article"
                        );


                    card.className =
                        "date-card aos-element";


                    const sunday =
                        isSunday(date);


                    const holiday =
                        isHoliday(date);


                    /*
                     * Add classes.
                     */

                    if (sunday) {

                        card.classList.add(
                            "sunday"
                        );

                    }


                    if (holiday) {

                        card.classList.add(
                            "holiday"
                        );

                    }


                    /*
                     * AOS animation.
                     */

                    const animations = [

                        "aos-fade-up",
                        "aos-fade-left",
                        "aos-fade-right",
                        "aos-zoom"

                    ];


                    card.classList.add(
                        animations[
                            index %
                            animations.length
                        ]
                    );


                    card.dataset.aosDelay =
                        (index % 5) * 70;


                    /*
                     * Date information.
                     */

                    const isoDate =
                        date.isoDate ||
                        "";


                    const displayDate =
                        isoDate ||
                        date.date ||
                        "";


                    const dayNumber =
                        date.dayNumber ||
                        getDayFromISO(
                            isoDate
                        );


                    const monthName =
                        date.monthName ||
                        getMonthFromISO(
                            isoDate
                        );


                    const dayName =
                        date.day ||
                        getDayNameFromISO(
                            isoDate
                        );


                    /*
                     * Holiday information.
                     */

                    let holidayHTML =
                        "";


                    if (holiday) {

                        const official =
                            officialHolidays2026[
                                isoDate
                            ];


                        const holidayName =
                            official
                                ? official.name
                                : (
                                    date.holidayName ||
                                    date.holiday ||
                                    "Public Holiday"
                                );


                        const holidayType =
                            official
                                ? official.type
                                : (
                                    date.holidayType ||
                                    "Holiday"
                                );


                        holidayHTML = `

                            <div class="holiday-info">

                                🎉
                                ${escapeHTML(
                                    holidayName
                                )}

                                <div class="holiday-type">

                                    ${escapeHTML(
                                        holidayType
                                    )}

                                </div>

                            </div>

                        `;

                    }


                    /*
                     * Sunday label.
                     */

                    let sundayHTML =
                        "";


                    if (sunday) {

                        sundayHTML = `

                            <span class="sunday-label">

                                Sunday

                            </span>

                        `;

                    }


                    /*
                     * Card HTML.
                     */

                    card.innerHTML = `

                        <div class="date-number">

                            ${escapeHTML(
                                dayNumber
                            )}

                        </div>


                        <div class="date-month">

                            ${escapeHTML(
                                monthName
                            )}

                        </div>


                        <div class="date-day">

                            ${escapeHTML(
                                dayName
                            )}

                        </div>


                        <div class="full-date">

                            ${escapeHTML(
                                displayDate
                            )}

                        </div>


                        ${holidayHTML}


                        ${sundayHTML}

                    `;


                    container.appendChild(
                        card
                    );

                }
            );


            /*
             * Reinitialize AOS for
             * dynamically-created cards.
             */

            initializeAOS();

        }


        /* ========================================================
           GET DAY FROM ISO
        ======================================================== */

        function getDayFromISO(
            isoDate
        ) {

            if (!isoDate) {
                return "";
            }


            return isoDate
                .slice(8, 10)
                .replace(/^0/, "");

        }


        /* ========================================================
           GET MONTH FROM ISO
        ======================================================== */

        function getMonthFromISO(
            isoDate
        ) {

            if (!isoDate) {
                return "";
            }


            const date =
                new Date(
                    isoDate +
                    "T00:00:00"
                );


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return "";

            }


            return date.toLocaleString(
                "en-US",
                {
                    month: "long"
                }
            );

        }


        /* ========================================================
           GET DAY NAME
        ======================================================== */

        function getDayNameFromISO(
            isoDate
        ) {

            if (!isoDate) {
                return "";
            }


            const date =
                new Date(
                    isoDate +
                    "T00:00:00"
                );


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return "";

            }


            return date.toLocaleString(
                "en-US",
                {
                    weekday: "long"
                }
            );

        }

        /* ========================================================
           ACTIVE BUTTON
        ======================================================== */

        function setActiveButton(
            active
        ) {

            document
                .querySelectorAll(
                    ".filter-button"

                .forEach(
                    function (button) {

                        button.classList.remove(
                            "active"
                        );

                    }
                );


            active.classList.add(
                "active"
            );

        }


        /* ========================================================
           AOS ENGINE
        ======================================================== */

        let aosObserver = null;


        function initializeAOS() {

            const elements =
                document.querySelectorAll(
                    ".aos-element"
                );


            /*
             * Browser fallback.
             */

            if (
                !(
                    "IntersectionObserver"
                    in window
                )
            ) {

                elements.forEach(
                    function (element) {

                        element.classList.add(
                            "aos-visible"
                        );

                    }
                );

                return;

            }


            /*
             * Disconnect old observer.
             */

            if (aosObserver) {

                aosObserver.disconnect();

            }


            /*
             * Create new observer.
             */

            aosObserver =
                new IntersectionObserver(
                    function (
                        entries
                    ) {

                        entries.forEach(
                            function (
                                entry
                            ) {

                                const element =
                                    entry.target;


                                if (
                                    entry.isIntersecting
                                ) {

                                    const delay =
                                        parseInt(
                                            element.dataset.aosDelay ||
                                            "0",
                                            10
                                        );


                                    setTimeout(
                                        function () {

                                            element.classList.add(
                                                "aos-visible"
                                            );

                                        },
                                        delay
                                    );

                                }
                                else {

                                    /*
                                     * Remove visible
                                     * state when the
                                     * element leaves
                                     * viewport.
                                     *
                                     * This makes the
                                     * animation play
                                     * again when the
                                     * user scrolls back.
                                     */

                                    element.classList.remove(
                                        "aos-visible"
                                    );

                                }

                            }
                        );

                    },
                    {

                        threshold: 0.12,

                        rootMargin:
                            "0px 0px -70px 0px"

                    }
                );


            elements.forEach(
                function (element) {

                    aosObserver.observe(
                        element
                    );

                }
            );

        }


        /* ========================================================
           ESCAPE HTML
        ======================================================== */

        function escapeHTML(
            value
        ) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";

            }


            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }
